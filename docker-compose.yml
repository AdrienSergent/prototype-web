# Environnement de développement : PostgreSQL 16 (+ ClamAV optionnel).
# API et front se lancent avec `npm run dev` ; voir README.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cir_owner
      POSTGRES_PASSWORD: cir_owner
      POSTGRES_DB: cir_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cir_owner -d cir_dev"]
      interval: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    profiles: ["antivirus"]
    ports: ["3310:3310"]

  # Image de production (API + front compilé servi par l'API), pour essai local : docker compose --profile prod up
  app:
    build: .
    profiles: ["prod"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      APP_URL: http://localhost:8080
      API_URL: http://localhost:8080
      PORT: 8080
      DATABASE_URL: postgres://cir_app:cir_app@postgres:5432/cir_dev
      DATABASE_OWNER_URL: postgres://cir_owner:cir_owner@postgres:5432/cir_dev
      # Reprise de l'environnement hôte (openssl rand -base64 32) ; sans elle, l'API refuse de démarrer en production.
      APP_ENCRYPTION_KEY:
      STORAGE_LOCAL_DIR: /data/storage
    ports: ["8080:8080"]
    volumes:
      - appdata:/data

volumes:
  pgdata:
  appdata:
